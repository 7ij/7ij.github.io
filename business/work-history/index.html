  <body>
    <div id="root"></div>
    <script>
      function notifyHeight() {
        var root = document.getElementById('root');
        var height = root && root.offsetHeight > 0 ? root.offsetHeight : document.body.scrollHeight;
        if (height > 0) {
          try {
            window.parent.postMessage({ type: 'workHistoryHeight', height: height }, '*');
          } catch (e) {}
        }
      }
      window.addEventListener('load', notifyHeight);
      window.addEventListener('resize', notifyHeight);
      if (typeof MutationObserver !== 'undefined') {
        var observer = new MutationObserver(notifyHeight);
        observer.observe(document.body, { childList: true, subtree: true });
      }
      setTimeout(notifyHeight, 200);
      setTimeout(notifyHeight, 1000);
    </script>
  </body>
