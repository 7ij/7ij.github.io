<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Sky / Dawn gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <!-- Sun gradient (warm energetic amber/orange) -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Foreground news fold gradient -->
    <linearGradient id="greenFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Sun rays drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#skyGrad)" stroke="#fde68a" stroke-width="2.5" />

  <!-- Sun Rays (subtle dawn beams) -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="64" y1="18" x2="64" y2="26" />
    <line x1="38" y1="28" x2="44" y2="34" />
    <line x1="90" y1="28" x2="84" y2="34" />
    <line x1="22" y1="52" x2="30" y2="54" />
    <line x1="106" y1="52" x2="98" y2="54" />
  </g>

  <!-- Glowing Rising Sun -->
  <circle cx="64" cy="54" r="24" fill="url(#sunGrad)" filter="url(#glow)" />
  <circle cx="64" cy="54" r="24" fill="url(#sunGrad)" />

  <!-- Sun Inner Shine -->
  <ellipse cx="58" cy="48" rx="8" ry="4" fill="#ffffff" opacity="0.4" />

  <!-- Newspaper / Horizon Waves (Forefront) -->
  <!-- Layer 1: Clean White Paper Fold -->
  <path d="M 12 76 Q 40 68, 64 74 T 116 72 L 116 114 C 116 118, 112 122, 106 122 L 22 122 C 16 122, 12 118, 12 114 Z" 
        fill="#ffffff" 
        stroke="#cbd5e1" 
        stroke-width="1.5" />

  <!-- Newspaper Lines on Fold -->
  <line x1="26" y1="84" x2="52" y2="84" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="26" y1="91" x2="62" y2="91" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="74" y1="84" x2="102" y2="84" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="74" y1="91" x2="96" y2="91" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Layer 2: Lush Green Horizon Arc symbolizing Valo Khobor -->
  <path d="M 8 92 C 34 82, 70 82, 120 94 L 120 98 C 120 114, 108 122, 92 122 L 36 122 C 20 122, 8 114, 8 98 Z" 
        fill="url(#greenFoldGrad)" />

  <text x="64" y="112" font-family="'Hind Siliguri', sans-serif" font-weight="700" font-size="11" fill="#ecfdf5" text-anchor="middle" letter-spacing="1">ভালো খবর</text>
</svg>
